name: CI

# v0.12.0 — hard quality gate for the open-source release. Every push/PR must
# pass typecheck + unit tests + build on the three first-class platforms; the
# 33-check e2e gate (real processes, stdio handshake, AST fixtures) runs on
# ubuntu first and expands to the other platforms once proven stable.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.os }} · Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: npm run install:all
      - name: Typecheck (all packages)
        run: npm run typecheck
      - name: Control-plane unit tests
        run: npm test
      - name: Web unit tests
        run: npm run test:web
      - name: Bridge adapters unit tests (V27-28)
        run: npm run test:bridge
      - name: Build all packages
        run: npm run build

  e2e-gate:
    name: E2E gate (33 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: npm run install:all
      - name: Build (gate needs dist/)
        run: npm run build
      - name: Run e2e closeout gate
        run: python3 scripts/e2e/closeout_gate.py
      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-result
          path: scripts/e2e/e2e-result.json

  # V27-24 (A1): the image was broken across releases because no gate ever
  # built it (relative-path imports from services/control-plane into packages/
  # were invisible to the two `COPY apps/ services/` lines). This job is the
  # regression door: if a future refactor adds cross-package source references
  # or base-image drift, PRs go red here instead of users discovering at deploy.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t codecompass:ci .
      - name: Smoke boot + /health inside the container
        run: |
          docker run -d --rm --name cc-smoke -p 127.0.0.1:43110:43110 codecompass:ci
          for i in $(seq 1 15); do
            sleep 2
            if curl -fsS http://127.0.0.1:43110/health; then ok=1; break; fi
          done
          docker rm -f cc-smoke
          test -n "$ok"
