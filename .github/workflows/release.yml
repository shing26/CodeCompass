name: Release

# Tag-driven release: build, verify, publish to npm and attach sample
# artifacts. Triggered by pushing a v* tag after CHANGELOG/version bumps.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: npm run install:all
      - name: Build (e2e gate needs dist/)
        run: npm run build
      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test
          npm run test:web
      - name: E2E gate
        run: python3 scripts/e2e/closeout_gate.py
      # v0.27-B R7 (V27-13)：真浏览器 UI 冒烟=发布门。立项动机：chatGuardSend
      # P0 存活两天而 330 单测全绿（mock 不校验参数、e2e 绕前端层）。零外网/
      # 零 token（本地 stub LLM，见 scripts/smoke/stub-llm.mjs），链=选库→
      # AskDock→流式回答→门禁真跑→杀后端重启验 WS 重连（不刷新页面）。
      - name: UI smoke (release gate)
        timeout-minutes: 12
        run: |
          # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD：npm 包 postinstall 不再全量拉三浏览器，
          # 统一交给 npx playwright install 只拉 chromium（省 ~350MB 与一个失败面）
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/smoke/ui_smoke.mjs
      - name: Generate sample artifact (open-source fixture)
        run: |
          mkdir -p dist-release
          export DEMO="$PWD/dist-release/demo-polyglot"
          mkdir -p "$DEMO/src/main/java/com/demo" "$DEMO/web/src"
          cat > "$DEMO/src/main/java/com/demo/OwnerController.java" <<'JAVA'
          package com.demo;
          import org.springframework.web.bind.annotation.*;
          @RestController
          @RequestMapping("/api/owners")
          public class OwnerController {
            private final OwnerService ownerService = new OwnerService();
            @GetMapping
            public String listOwners() { return ownerService.findOwners(); }
          }
          JAVA
          cat > "$DEMO/src/main/java/com/demo/OwnerService.java" <<'JAVA'
          package com.demo;
          import org.springframework.stereotype.Service;
          @Service
          public class OwnerService {
            private final OwnerRepository ownerRepository = new OwnerRepository();
            public String findOwners() { return ownerRepository.findAll(); }
          }
          JAVA
          cat > "$DEMO/src/main/java/com/demo/OwnerRepository.java" <<'JAVA'
          package com.demo;
          import org.apache.ibatis.annotations.Mapper;
          import org.apache.ibatis.annotations.Select;
          @Mapper
          public interface OwnerRepository {
            @Select("SELECT * FROM owners")
            String findAll();
          }
          JAVA
          cat > "$DEMO/web/src/api-client.ts" <<'TS'
          import axios from 'axios';
          export const api = axios.create({ baseURL: '/api' });
          export function loadOwners() { return api.get('/owners'); }
          TS
          node services/control-plane/dist/cli.js export listOwners --repo "$DEMO" --file dist-release/architecture-artifact.html
      # npm publish 有意缺席（2026-09-04 v0.19.0 裁决切 B：内测期不发 npm，
      # ENEEDAUTH 首曝于 v0.19.0 Release run 33841695684）。恢复公开发布时
      # 重新加入 publish 步骤并配置 NPM_TOKEN secret。
      - name: Create GitHub release with sample artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/architecture-artifact.html
            scripts/e2e/e2e-result.json
          generate_release_notes: true
